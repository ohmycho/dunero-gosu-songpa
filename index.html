      { id: "3LPWY1_nMu0", cat: "구구단·곱셈·19단", key: "125×16 구조 기반 연산", title: "125 × 16을 암산으로 1초 만에! 양을 이기는 '구조 기반' 수학의 비밀", orig: "[두뇌로수학] ➕수학의 뼈대를 세우세요 | '구조기반' 수학의 비밀", desc: "무작정 세로셈을 쓰는 대신 125×8×2 = 1000×2 = 2000으로 구조를 쪼개면 실수는 줄고 속도는 빨라집니다. 연산과 개념을 하나로 연결합니다.", tags: ["구조기반수학", "곱셈꿀팁", "수의구조", "개인별커리큘럼", "초4", "초5"] },

      { id: "uPOn-k7juG4", cat: "분수·소수·큰수", key: "초4 만·억·조 큰 수 마스터", title: "4학년 첫 고비 '만·억·조 큰 수', 헷갈리지 않고 마스터하는 4단계", orig: "[두뇌로수학] ✅ 큰 수 개념 마스터 방법 | 4학년 큰 수 이해하기", desc: "①뉴스 속 아파트값 등 실생활 연결 ②4자리씩 끊어 읽기 & 0의 개수와 자릿수(만은 5자리, 억은 9자리) 구분 ③자리의 실제 값 연결 ④9900원과 1만원 크기 비교.", tags: ["초4", "큰수", "만억조", "자릿수", "실생활수학", "수의크기"] },
      { id: "zWTahdj-7Vk", cat: "분수·소수·큰수", key: "초4 분수와 나눗셈 연결", title: "3학년 땐 잘하던 분수, 4학년 때 갑자기 무너지는 진짜 이유", orig: "[두뇌로수학] ✅ 4학년 분수의 비밀", desc: "1/3이 1/2보다 크다고 착각하거나 대분수·가분수 변환 공식만 외우면 막힙니다. 3/4과 3÷4(나눗셈)의 개념 연결이 5학년 약분·통분과 중등 함수의 고리입니다.", tags: ["초4", "분수", "가분수", "대분수", "나눗셈연결", "분모와분자"] },
      { id: "p0seiZnSXp0", cat: "분수·소수·큰수", key: "초5 분수 완성과 비례식", title: "초등 수학의 완성 '5학년 분수', 문제 양만 늘리면 위험합니다", orig: "[두뇌로수학] ✅ 5학년 분수, 왜 중요할까요?", desc: "5학년 약분·통분은 6학년 비와 비율, 비례식, 백분율, 중등 방정식의 뿌리입니다. 과정을 생략하지 않는 태도와 검산 기준을 세워야 합니다.", tags: ["초5", "분수완성", "약분과통분", "비와비율", "백분율", "검산습관"] },

      { id: "sBvErYQuEn0", cat: "평면도형·도형이동", key: "초3·4 도형 성질과 각도 체험", title: "1~2학년 땐 쉬웠던 도형, 3~4학년 때 갑자기 무너지는 이유", orig: "[생각의 고수] ▶️ 3,4학년 도형 그 벽을 넘는 방법", desc: "눈에 보이는 모양만 구별하던 저학년과 달리 3~4학년은 각의 크기, 변의 길이, 평행과 수직 등 조건과 관계를 봐야 합니다. 직접 각을 재고 겹쳐보는 체험이 필수입니다.", tags: ["초3", "초4", "도형의벽", "각도", "평행과수직", "교구체험"] },
      { id: "Ccc2XyEUfuM", cat: "평면도형·도형이동", key: "초4 삼각형 결정조건과 골든타임", title: "철사 81cm로 정삼각형 3개 만들기! 4학년 도형 골든타임 공략법 4가지", orig: "[생각의 고수] ▶️ 4학년 도형의 골든타임 | 연산은 잘 하는데 도형은 어렵다?", desc: "①곧은 선분으로 정의하기 ②식 세우기 전 그림으로 변 9개 확인하기 ③6·8·14cm 막대로 삼각형 결정조건 체험하기 ④각과 마주 보는 변의 길이 관계 질문하기.", tags: ["초4", "삼각형성질", "도형골든타임", "중등기하연결", "삼각비기초"] },
      { id: "vvoGNxx4jm8", cat: "평면도형·도형이동", key: "초4 평면도형 밀기·뒤집기·돌리기", title: "연산 우등생이 4학년 '평면도형 이동(밀기·뒤집기·돌리기)'에서 무너지는 이유", orig: "[생각의 고수] 🔺3,4학년 도형의 벽 | 왜 연산 우등생들은 무너질까?", desc: "종이를 직접 밀고 뒤집고 돌려본 경험이 없으면 머릿속 도형 회전이 안 됩니다. 또한 반직선·선분·평행사변형·둔각 등 낯선 용어를 카드와 그리기로 친숙하게 해야 합니다.", tags: ["초3", "초4", "밀기뒤집기돌리기", "도형용어", "연산우등생", "평면도형"] },
      { id: "40eGrwokRbU", cat: "평면도형·도형이동", key: "초6 원주율(3.14)과 컴퍼스 작도", title: "'지름×3.14' 무조건 외우지 마세요! 작도로 깨치는 6학년 원주와 원주율", orig: "[생각의 고수] 🌿 6학년 원주, 어떻게 배워야 할까?", desc: "'지름(가로지르는 길)'과 '원주(원의 둘레)' 용어의 뜻을 알고, 자와 컴퍼스 작도를 통해 지름과 둘레 사이의 일정한 비율(3.14)과 보조선 감각을 스스로 깨우칩니다.", tags: ["초6", "원주율", "원의둘레", "컴퍼스작도", "3.14원리", "중심각"] },
      { id: "ZG_6jEYPkRs", cat: "평면도형·도형이동", key: "도형 추상화와 계산실수 해결", title: "도형을 잘하는 아이들이 '계산 실수'까지 적은 놀라운 이유 (추상화의 힘)", orig: "[생각의 고수] 🔺잦은 계산실수, 그 해결방법은?", desc: "도형은 복잡한 것에서 핵심 특징만 뽑아 구조화하는 '추상화' 학문입니다. 점→선→면→입체의 관계를 보듯 숫자와 기호, 받아올림의 구조를 정리해 계산 실수가 사라집니다.", tags: ["계산실수", "추상화능력", "도형과연산", "핵심정보정리", "구조화"] },

      { id: "GLQPkm1xnHg", cat: "입체도형·전개도·공간", key: "손흥민 코너킥과 3D 공간지각력", title: "손흥민의 환상적인 코너킥(원더골)과 상위 1% 도형 공간지각력의 공통점", orig: "[생각의 고수] 🔺머릿 속에서 도형이 움직인다 | 공간지각력 도형학습법", desc: "각도·회전·공간을 계산하는 코너킥처럼, 쌓기나무의 숨겨진 블록 개수나 전개도를 머릿속에서 3D로 시뮬레이션하려면 여러 방향에서 보고 만지는 반복 훈련이 필수입니다.", tags: ["공간지각력", "쌓기나무", "3D시뮬레이션", "보이지않는면", "초3", "초4", "초5"] },

      { id: "4vVZ0WtY02c", cat: "6·7세 유아·교육철학", key: "6·7세 멈추고 버티는 과제집착력", title: "문제를 보자마자 풀지 않고 '잠깐 멈추고 버티는 힘'이 성적을 결정합니다", orig: "[생각의 고수] 🌿빨리 푸는 것 보다 끝까지 생각하는게 먼저", desc: "조금만 어려워도 엄마를 찾는 6·7세 아이에게 필요한 건 문제 양이 아니라 '모르는 상태를 버텨보는 경험'입니다. 교구와 퍼즐로 스스로 시도하는 기준을 만듭니다.", tags: ["6세", "7세", "과제집착력", "생각하는힘", "엄마의존탈피"] },

      { id: "BQWkixd-YH4", cat: "6·7세 유아·교육철학", key: "무늬만 사고력 vs 논리퍼즐 추론", title: "선생님 풀이 받아 적는 '무늬만 사고력 수학' vs 스스로 추론하는 '논리 퍼즐'", orig: "[생각의 고수] 🔺무늬만 사고력 수학?! | 정답보다 '생각하는 힘'", desc: "어려운 유형을 외우게 하는 기존 사고력 수업의 한계를 넘어, 공식 없이도 조건을 연결해 끝까지 추론하는 퍼즐리그·논리퍼즐을 통해 생각 자체를 즐기게 만듭니다.", tags: ["사고력수학", "논리퍼즐", "퍼즐리그", "추론능력", "생각하는힘"] },
      { id: "ASRMRSgdqGo", cat: "6·7세 유아·교육철학", key: "타고난 수학머리와 발문법", title: "'우리 애는 수학 머리가 없나 봐요' 단정 짓기 전에 꼭 바꿔야 할 질문법", orig: "[생각의 고수] ▶️ 타고 난 수학머리, 진짜 있을까?", desc: "막혔을 때 바로 힌트를 주면 설명만 기다리는 아이가 됩니다. '조건이 하나 바뀌면 어떻게 될까?' 질문하며 예상→시도→실패→재도전의 경험을 쌓아주면 수학 머리가 열립니다.", tags: ["수학머리", "힌트금지", "발문법", "후천적사고력", "시행착오"] },
      { id: "8aW2NB0JLI4", cat: "6·7세 유아·교육철학", key: "직관을 논리로 바꾸는 3년 뒤 실력", title: "아이의 '직관(촉)'을 '논리(설명)'로 끌어올려야 중등 기하·고등 킬러를 뚫습니다", orig: "[생각의 고수] 3년 뒤 우리아이 공부 실력은?", desc: "'어, 여기 들어갈 것 같아'라는 직관에만 머물면 중고등에서 무너집니다. 퍼즐을 통해 [직관 → 사고 → 구조 → 논리(말로 설명)]로 끌어올리는 훈련이 3년 뒤 상위권을 결정합니다.", tags: ["직관과논리", "상위권비결", "고등킬러대비", "3년뒤실력", "말로설명하기"] },
      { id: "b2npMNoMjlg", cat: "6·7세 유아·교육철학", key: "엄마들이 숨기고 싶어하는 두뇌로 후기", title: "'원장님, 소문내기 싫어요' 학부모님들이 두뇌로 수학을 주변에 숨기는 이유", orig: "[두뇌로수학] ➕우리 아이만 다녔으면 좋겠어요 | 학부모님들이 '두뇌로' 다니는걸 숨기는 이유", desc: "문제를 많이 풀려서도 유명해서도 아닙니다. 수를 가르고 연결하며 심화 문제 앞에서도 '한번 해볼게요!'라고 도전하는 아이의 태도 변화 때문에 나만 알고 싶은 학원이 되었습니다.", tags: ["두뇌로후기", "학부모상담", "도전하는아이", "최상위권수학", "송파강동학원"] },
      { id: "uQLke2EQugQ", cat: "6·7세 유아·교육철학", key: "도형·퍼즐·연산 통합과 교사 직강", title: "연산 학원 따로, 사고력 따로? '도형·퍼즐·연산'을 하나로 묶어야 터집니다", orig: "[생각의 고수] 도형, 퍼즐, 연산...지금 따로 하고 있나요?", desc: "소마큐브·펜토미노 같은 영재 교구와 교과 도형, 연산 구조를 하나로 엮어 올림피아드·영재원까지 대비합니다. 강남·송파 교사 교육을 직접 진행하는 지사장님의 발문법이 핵심입니다.", tags: ["통합사고력", "소마큐브", "펜토미노", "영재원대비", "송파강동학원"] }
    ];

    let videos = FALLBACK_VIDEOS;

    // CSV 한 덩어리를 행 배열로 (따옴표 안의 쉼표·줄바꿈 처리)
    function parseCSV(text) {
      const rows = []; let row = []; let cell = ""; let q = false;
      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        if (q) {
          if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; }
          else cell += c;
        } else if (c === '"') q = true;
        else if (c === ",") { row.push(cell); cell = ""; }
        else if (c === "\n") { row.push(cell); rows.push(row); row = []; cell = ""; }
        else if (c !== "\r") cell += c;
      }
      if (cell !== "" || row.length) { row.push(cell); rows.push(row); }
      return rows;
    }

    const oneLine = t => String(t || "").replace(/\s*[\r\n]+\s*/g, " ").replace(/\\/g, "").trim();

    function rowsToVideos(rows) {
      const head = rows[0].map(h => h.trim());
      const at = name => head.indexOf(name);
      const C = { show: at("노출"), id: at("영상 ID"), title: at("제목"), cat: at("카테고리"), key: at("핵심 키워드"),
                  orig: at("원제목"), desc: at("설명"), tags: at("태그"), date: at("올린 날짜") };
      if (C.show < 0 || C.id < 0 || C.title < 0) throw new Error("시트 1행 열 이름이 다릅니다");
      const get = (r, i) => (i >= 0 && r[i] != null ? r[i] : "");
      return rows.slice(1)
        .filter(r => get(r, C.show).trim().toUpperCase() === "Y" && /^[\w-]{11}$/.test(get(r, C.id).trim()))
        .map(r => ({
          id: get(r, C.id).trim(),
          cat: oneLine(get(r, C.cat)),
          key: oneLine(get(r, C.key)),
          title: oneLine(get(r, C.title)),
          orig: oneLine(get(r, C.orig)),
          desc: oneLine(get(r, C.desc)),
          tags: oneLine(get(r, C.tags)).split(/[\s,]+/).map(t => t.replace(/^#/, "")).filter(Boolean),
          date: get(r, C.date).trim()
        }));
    }

    async function loadVideoSheet() {
      if (!SHEET_URL || SHEET_URL.startsWith("__")) return;
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 8000);
      try {
        const res = await fetch(SHEET_URL, { signal: ctrl.signal, cache: "no-store" });
        if (!res.ok) throw new Error("HTTP " + res.status);
        const list = rowsToVideos(parseCSV(await res.text()));
        if (list.length) { videos = list; updateAllCount(); render(); }
      } catch (e) {
        console.warn("[영상 시트] 불러오기 실패, 기본 목록 사용:", e);
      } finally {
        clearTimeout(timer);
      }
    }

    const escHtml = t => String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    const jsArg = t => escHtml(String(t).replace(/\\/g, "\\\\").replace(/'/g, "\\'"));

    // 썸네일이 안 열리면 다른 주소로 한 번 더 시도, 그래도 안 되면 회색 칸만 남김
    function thumbFail(img) {
      if (!img.dataset.retry) { img.dataset.retry = "1"; img.src = `https://img.youtube.com/vi/${img.dataset.id}/mqdefault.jpg`; }
      else img.style.display = "none";
    }

    function isNew(v) {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(v.date || "")) return false;
      const days = (Date.now() - new Date(v.date + "T00:00:00+09:00").getTime()) / 86400000;
      return days >= 0 && days <= NEW_DAYS;
    }

    function updateAllCount() {
      const b = document.getElementById("allCatBtn");
      if (b) b.textContent = `전체 (${videos.length})`;
    }

    let currentCat = "전체";
    let searchQuery = "";

    const listEl = document.getElementById("videoList");
    const countEl = document.getElementById("resultCount");
    const searchInput = document.getElementById("searchInput");
    const clearBtn = document.getElementById("clearBtn");

    function render() {
      const q = searchQuery.trim().toLowerCase().replace(/^#/, "");
      const filtered = videos.filter(v => {
        const matchCat = currentCat === "전체" || v.cat === currentCat;
        const matchQuery = !q || 
          v.title.toLowerCase().includes(q) || 
          v.key.toLowerCase().includes(q) ||
          v.orig.toLowerCase().includes(q) || 
          v.desc.toLowerCase().includes(q) || 
          v.tags.some(t => t.toLowerCase().includes(q));
        return matchCat && matchQuery;
      });

      countEl.textContent = `총 ${filtered.length}개의 맞춤 영상`;

      if (filtered.length === 0) {
        listEl.innerHTML = `<div class="bg-white rounded-2xl p-10 text-center text-slate-400 text-sm shadow-sm">해당 키워드의 영상이 없습니다. 다른 단어로 검색해 보세요!</div>`;
        return;
      }

      listEl.innerHTML = filtered.map(v => `
        <article class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200/80 flex gap-3.5 items-start hover:border-indigo-400 transition">
          <!-- 썸네일 -->
          <div onclick="openModal('${v.id}', '${jsArg(v.title)}')" class="relative w-24 h-36 sm:w-28 sm:h-40 shrink-0 rounded-xl overflow-hidden bg-slate-200 cursor-pointer group shadow-inner">
            <img src="https://i.ytimg.com/vi/${v.id}/hqdefault.jpg" data-id="${v.id}" alt="" loading="lazy" onerror="thumbFail(this)" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" />
            <div class="absolute inset-0 bg-black/30 flex items-center justify-center">
              <div class="w-9 h-9 rounded-full bg-red-600 text-white flex items-center justify-center text-xs pl-0.5 shadow-lg">▶</div>
            </div>
          </div>

          <!-- 본문 정보 -->
          <div class="flex-1 min-w-0">
            <div class="flex flex-wrap items-center gap-1.5 mb-1.5">
              ${isNew(v) ? `<span class="text-[11px] font-extrabold px-2 py-0.5 rounded bg-red-600 text-white">NEW</span>` : ""}
              ${v.cat ? `<span class="text-[11px] font-extrabold px-2 py-0.5 rounded bg-indigo-100 text-indigo-800">${v.cat}</span>` : ""}
              ${v.key ? `<span class="text-[11px] font-bold px-2 py-0.5 rounded bg-amber-100 text-amber-900">🔑 ${v.key}</span>` : ""}
            </div>
            
            <h2 onclick="openModal('${v.id}', '${jsArg(v.title)}')" class="text-sm sm:text-base font-extrabold text-slate-900 leading-snug cursor-pointer hover:text-indigo-700 mb-1.5">
              ${v.title}
            </h2>
            
            <p class="text-xs text-slate-600 leading-relaxed mb-2.5">${v.desc}</p>
            
            <!-- 해시태그 -->
            <div class="flex flex-wrap gap-1 mb-3">
              ${v.tags.map(t => `<span onclick="setTagSearch('${jsArg(t)}')" class="text-[11px] font-medium bg-slate-100 hover:bg-indigo-100 text-slate-600 hover:text-indigo-800 px-2 py-0.5 rounded cursor-pointer transition">#${t}</span>`).join("")}
            </div>

            <!-- 하단 액션 버튼 -->
            <div class="flex gap-1.5">
              <button onclick="openModal('${v.id}', '${jsArg(v.title)}')" class="py-2 px-3 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold text-center shadow-sm">
                ▶ 바로 재생
              </button>
              <button onclick="copyShare('${v.id}', '${jsArg(v.title)}', '${jsArg(v.desc)}')" class="flex-1 py-2 px-3 rounded-xl bg-amber-400 hover:bg-amber-500 text-indigo-950 text-xs font-extrabold text-center shadow-sm">
                💬 상담멘트+링크 복사
              </button>
              <button onclick="copyUrlOnly('${v.id}')" class="py-2 px-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold">
                🔗 링크
              </button>
            </div>
          </div>
        </article>
      `).join("");
    }

    function setTagSearch(tag) {
      currentCat = "전체";
      document.querySelectorAll(".cat-btn").forEach((b, i) => {
        b.className = i === 0 
          ? "cat-btn active shrink-0 px-3 py-1.5 rounded-full text-xs font-extrabold bg-amber-400 text-indigo-950"
          : "cat-btn shrink-0 px-3 py-1.5 rounded-full text-xs font-semibold bg-indigo-950/60 text-indigo-100 hover:bg-indigo-800";
      });
      searchInput.value = tag;
      searchQuery = tag;
      clearBtn.classList.remove("hidden");
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function openModal(id, title) {
      document.getElementById("modalTitle").textContent = title;
      document.getElementById("modalIframe").src = `https://www.youtube.com/embed/${id}?autoplay=1`;
      const modal = document.getElementById("videoModal");
      modal.classList.remove("hidden");
      modal.classList.add("flex");
    }

    document.getElementById("closeModal").addEventListener("click", () => {
      document.getElementById("modalIframe").src = "";
      const modal = document.getElementById("videoModal");
      modal.classList.add("hidden");
      modal.classList.remove("flex");
    });

    function showToast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.classList.remove("opacity-0");
      setTimeout(() => t.classList.add("opacity-0"), 2200);
    }

    function copyShare(id, title, desc) {
      const text = `📌 [${title}]\n\n💡 핵심 포인트:\n${desc}\n\n▶ 송파·강동 두뇌로수학 영상 바로보기:\nhttps://youtube.com/shorts/${id}`;
      navigator.clipboard.writeText(text).then(() => {
        showToast("✅ [상담 멘트 + 쇼츠 링크]가 복사되었습니다! 카톡에 붙여넣으세요.");
      });
    }

    function copyUrlOnly(id) {
      const url = `https://youtube.com/shorts/${id}`;
      navigator.clipboard.writeText(url).then(() => {
        showToast("🔗 유튜브 쇼츠 링크가 복사되었습니다!");
      });
    }

    searchInput.addEventListener("input", e => {
      searchQuery = e.target.value;
      clearBtn.classList.toggle("hidden", !searchQuery);
      render();
    });

    clearBtn.addEventListener("click", () => {
      searchInput.value = "";
      searchQuery = "";
      clearBtn.classList.add("hidden");
      render();
    });

    document.querySelectorAll(".cat-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".cat-btn").forEach(b => {
          b.className = "cat-btn shrink-0 px-3 py-1.5 rounded-full text-xs font-semibold bg-indigo-950/60 text-indigo-100 hover:bg-indigo-800";
        });
        btn.className = "cat-btn active shrink-0 px-3 py-1.5 rounded-full text-xs font-extrabold bg-amber-400 text-indigo-950";
        currentCat = btn.dataset.cat;
        render();
      });
    });

    updateAllCount();
    render();
    loadVideoSheet();
  </script>
</body>
